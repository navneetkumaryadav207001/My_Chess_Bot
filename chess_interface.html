<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chess AI – ONNX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <style>
    body { font-family: Arial, sans-serif; background: #f0f0f0; text-align: center; padding: 20px; }
    #board { width: 400px; margin: 20px auto; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    #status { font-weight: bold; margin-top: 10px; }
    #loading { display: none; font-style: italic; color: #666; }
  </style>
</head>
<body>
  <h1>Chess AI (ONNX)</h1>
  <p>You play <b>White</b>. AI plays <b>Black</b>.</p>

  <div id="board"></div>

  <div>
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="undoBtn">Undo</button>
  </div>

  <div id="status">Initializing...</div>
  <div id="loading">AI thinking...</div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <script>
    let board = null;
    let game = new Chess();
    let session = null;

    const statusEl = document.getElementById("status");
    const loadingEl = document.getElementById("loading");

    async function loadModel() {
      try {
        session = await ort.InferenceSession.create("./model_pretrained_14002.onnx");
        statusEl.textContent = "Model loaded. Click Start to play.";
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Error: Could not load ONNX model.";
      }
    }

    function initBoard() {
      board = Chessboard("board", {
        position: "start",
        orientation: "white", // Changed to white
        draggable: true,
        onDragStart,
        onDrop,
        onSnapEnd,
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
      });
    }

    function onDragStart(source, piece) {
      if (game.game_over() || !session) return false;
      // ONLY allow moves for White (user)
      if (game.turn() !== "w" || piece.search(/^b/) !== -1) return false;
    }

    async function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: "q"
      });

      if (move === null) return "snapback";

      updateStatus();
      
      // If it is now Black's turn, trigger AI
      if (!game.game_over() && game.turn() === 'b') {
        loadingEl.style.display = "block";
        setTimeout(makeAIMove, 250);
      }
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    async function makeAIMove() {
  if (!session || game.game_over()) return;

  try {
    const inputTensor = boardToTensor(game.board());
    const results = await session.run({ [session.inputNames[0]]: inputTensor });
    const logits = results[session.outputNames[0]].data;

    const legalMoves = game.moves({ verbose: true });
    const temperature = 1.0; // Adjust this: 0.1 = Robotic, 2.0 = Random/Wild

    // 1. Get scores for legal moves and apply Temperature
    let movesWithScores = legalMoves.map(move => {
      const idx = squareToIndex(move.from) * 64 + squareToIndex(move.to);
      return { move, score: Math.exp((logits[idx] || -10) / temperature) };
    });

    // 2. Calculate sum for normalization
    const sumScore = movesWithScores.reduce((a, b) => a + b.score, 0);

    // 3. Pick a move based on weighted probability
    let randomThreshold = Math.random() * sumScore;
    let selectedMove = movesWithScores[0].move;

    for (const item of movesWithScores) {
      randomThreshold -= item.score;
      if (randomThreshold <= 0) {
        selectedMove = item.move;
        break;
      }
    }

    game.move(selectedMove);
    board.position(game.fen());
  } catch (err) {
    console.error("AI Error:", err);
  }
  loadingEl.style.display = "none";
  updateStatus();
}

    function boardToTensor(boardArray) {
      const map = {
        p: -1, n: -2, b: -3, r: -4, q: -5, k: -6,
        P: 1, N: 2, B: 3, R: 4, Q: 5, K: 6
      };
      const data = new Float32Array(64);
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = boardArray[r][c];
          const idx = (7 - r) * 8 + c; 
          data[idx] = piece ? map[piece.color === 'w' ? piece.type.toUpperCase() : piece.type] : 0;
        }
      }
      return new ort.Tensor("float32", data, [1, 64]);
    }

    function squareToIndex(sq) {
      const file = sq.charCodeAt(0) - 97; 
      const rank = parseInt(sq[1], 10) - 1; 
      return rank * 8 + file;
    }

    function updateStatus() {
      let status = "";
      let moveColor = game.turn() === "w" ? "White" : "Black";

      if (game.in_checkmate()) {
        status = "Checkmate! " + (game.turn() === 'w' ? 'AI (Black)' : 'You (White)') + " wins.";
      } else if (game.in_draw()) {
        status = "Game over, draw.";
      } else {
        status = moveColor + " to move";
        if (game.in_check()) status += " (Check!)";
      }
      statusEl.textContent = status;
    }

    document.getElementById("startBtn").onclick = () => {
      game.reset();
      board.start();
      board.orientation('white');
      updateStatus();
    };

    document.getElementById("resetBtn").onclick = () => {
      game.reset();
      board.start();
      statusEl.textContent = "Reset.";
    };

    document.getElementById("undoBtn").onclick = () => {
      game.undo(); // Undo Black (AI)
      game.undo(); // Undo White (Player)
      board.position(game.fen());
      updateStatus();
    };

    loadModel();
    initBoard();
  </script>
</body>
</html>
